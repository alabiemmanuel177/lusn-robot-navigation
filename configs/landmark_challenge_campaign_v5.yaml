schema_version: landmark-challenge-campaign/v1
challenge_id: validation-identity-spheres-v5
partition: validation
protected_test_data: false
online_ground_truth_used: false
segmentation_labels_used: false
detector_configuration_changed: false
supersedes_review_queues: [v3, v4]
reason: >-
  V3 used identity-ambiguous rectangles. The v4 pre-review pilot introduced spheres,
  but its visual audit found the sign sphere clipped at the image edge. V5 lowers every
  sphere and uses the narrowest validated occluder so its full curved silhouette and
  more of the unchanged scene are visible.
design: >-
  A visual-only neutral occluder hides the registered marker while an unregistered,
  collision-free emissive sphere rendered from the frozen camera-space palette is
  placed inside the unchanged association radius. Human review judges object identity.
