schema_version: landmark-challenge-campaign/v1
challenge_id: validation-identity-spheres-v4
partition: validation
protected_test_data: false
online_ground_truth_used: false
segmentation_labels_used: false
detector_configuration_changed: false
supersedes_review_queue: v3
reason: >-
  V3 used rectangular swatches against cuboid landmarks, so identity was not reliably
  judgeable from the review frames. V4 replaces every swatch with an unmistakable sphere,
  narrows the neutral occluder, and increases camera distance to retain scene context.
design: >-
  A visual-only neutral occluder hides the registered marker while an unregistered
  emissive sphere rendered from the linearized frozen camera-space sRGB palette is placed
  inside the unchanged association radius. Human review judges semantic object identity.
