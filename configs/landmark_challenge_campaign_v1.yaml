schema_version: landmark-challenge-campaign/v1
challenge_id: validation-palette-impostors-v1
partition: validation
protected_test_data: false
online_ground_truth_used: false
segmentation_labels_used: false
detector_configuration_changed: false
design: >-
  A visual-only neutral occluder hides one registered landmark while an unregistered
  vertical emissive swatch rendered from the linearized frozen camera-space sRGB palette
  is placed inside the deployed association radius. This models a palette-like display
  or light source without changing the detector. Human review, not the challenge
  specification, supplies verdicts.
