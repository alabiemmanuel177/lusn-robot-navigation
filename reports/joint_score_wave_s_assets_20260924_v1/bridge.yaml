# ros_gz bridge. Derived from turtlebot3_waffle_bridge.yaml with the study sensors added.
#
# The last three entries are EVALUATION ONLY. They exist so that collisions, pose error
# and segmentation labels are measured rather than estimated. No navigation node may
# subscribe to them. tests/test_evaluation_only_isolation.py enforces this.

- topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- topic_name: "joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- topic_name: "odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- topic_name: "tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- topic_name: "imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- topic_name: "scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- topic_name: "cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# --- study sensors ---
- topic_name: "camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- topic_name: "camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- topic_name: "camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# --- EVALUATION ONLY below this line ---
# Semantic label pixels come from a second camera with the exact RGB-D intrinsics and
# pose.  The Gazebo semantic labels map stores the class ID in all three RGB channels.
- ros_topic_name: "camera/segmentation"
  gz_topic_name: "camera/segmentation/labels_map"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# These two need explicit source names. The contact sensor ignores its <topic> element
# and publishes to the fully scoped sensor path, and PosePublisher always publishes to
# /model/<name>/pose. Both are renamed here to the short names the logger expects.
- ros_topic_name: "collision_raw/base_contact"
  gz_topic_name: "/world/default/model/turtlebot3_waffle/link/base_link/sensor/base_contact/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS

- ros_topic_name: "collision_raw/wheel_left_contact"
  gz_topic_name: "/world/default/model/turtlebot3_waffle/link/wheel_left_link/sensor/wheel_left_contact/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS

- ros_topic_name: "collision_raw/wheel_right_contact"
  gz_topic_name: "/world/default/model/turtlebot3_waffle/link/wheel_right_link/sensor/wheel_right_contact/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS

- ros_topic_name: "collision_raw/caster_back_right_contact"
  gz_topic_name: "/world/default/model/turtlebot3_waffle/link/caster_back_right_link/sensor/caster_back_right_contact/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS

- ros_topic_name: "collision_raw/caster_back_left_contact"
  gz_topic_name: "/world/default/model/turtlebot3_waffle/link/caster_back_left_link/sensor/caster_back_left_contact/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS

- ros_topic_name: "collision_raw/lidar_contact"
  gz_topic_name: "/world/default/model/turtlebot3_waffle/link/base_scan/sensor/lidar_contact/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS

- ros_topic_name: "collision_raw/camera_contact"
  gz_topic_name: "/world/default/model/turtlebot3_waffle/link/camera_link/sensor/camera_contact/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS

- ros_topic_name: "ground_truth_pose"
  gz_topic_name: "/model/turtlebot3_waffle/pose"
  ros_type_name: "geometry_msgs/msg/PoseStamped"
  gz_type_name: "gz.msgs.Pose"
  direction: GZ_TO_ROS
