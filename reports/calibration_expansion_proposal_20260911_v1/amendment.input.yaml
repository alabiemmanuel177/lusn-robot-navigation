  classes: [chair, doorway, laboratory_entrance, office_entrance]
  simulator_seed: 1
  treatments: [visual_occluder_20_percent_projected_target_area, same_colour_nonlandmark_distractor]
  attempts: 80
  collision_geometry_changed: false
  new_landmark_ids_or_relabelled_catalogue: false
  asset_and_pose_preflight_required_before_approval: true
  treatment_recipe_status: specification_only_not_built_or_validated
  errors_are_natural: false
  use_to_fill_primary_negative_quota: false

freeze_and_analysis:
  confidence_function_palette_thresholds_fov_and_association_radius: retain_current_snapshot
  temperature_changed_to_populate_bins: false
  scores_manually_lowered_or_labels_injected: false
  calibration_fit_partition: development_only
  validation_partition_used_for_fitting_or_model_selection: false
  coverage_gate_applied_separately_to_development_and_validation: true
  per_partition_gate_is_proposed_additional_safeguard: true
  calibration_family_and_hyperparameters: require_separate_prespecified_choice
  observed_deployment_prevalence_claimed: false
  distribution_scope: prespecified_equal_map_class_view_mixture
