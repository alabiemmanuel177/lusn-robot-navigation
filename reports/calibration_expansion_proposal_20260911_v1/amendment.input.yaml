  verified_predispatch_infrastructure_retries_max: 1
  retry_identity: new_attempt_id_with_original_retained
  statistical_unit: map_and_view_group_not_rgb_pixels_or_repeated_frames
  seed_repeats_count_as_independent_worlds: false
  fixed_budget_stopping: complete_schedule_then_audit_no_outcome_chasing
  unmet_coverage: blocked_new_prospective_amendment_required

diagnostic_panel:
  included_in_calibration_fit_or_primary_validation: false
